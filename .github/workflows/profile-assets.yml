name: Profile assets

# Builds the 3D contribution calendar and the contribution snake and
# publishes them to the `output` branch. Runs on push to main or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one run at a time; two runs racing to create the output branch fail.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      # dist/ is created root-owned by the snake container, so assemble a new dir
      - name: Collect assets
        run: |
          mkdir site
          cp -r dist/. site/
          cp -r profile-3d-contrib site/
          ls -R site
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: site
          commit_message: Update profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
